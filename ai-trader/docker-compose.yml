services:
  worker:
    build: .
    command: python -m src.worker
    env_file: .env
    restart: unless-stopped
    volumes:
      - ./data:/app/data

  api:
    build: .
    command: uvicorn src.api.app:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      - worker

