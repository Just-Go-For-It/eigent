<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ai-trader — dashboard</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 880px; margin: 2rem auto; padding: 0 1rem; color:#123; }
    h1 { color:#0b3d5c; } code { background:#eef; padding:1px 5px; border-radius:4px; }
    .card { border:1px solid #cdd; border-radius:8px; padding:1rem; margin:1rem 0; }
    input,button { font-size:1rem; padding:.4rem .6rem; }
    table { border-collapse:collapse; width:100%; } td,th { border:1px solid #cdd; padding:.4rem; text-align:left; }
    .warn { background:#fff7e6; border-left:4px solid #d90; padding:.6rem 1rem; }
  </style>
</head>
<body>
  <h1>ai-trader</h1>
  <p class="warn">Read-only dashboard. The trading brain runs on the VPS/Railway worker — not here.
  Vercel hosts only this static page (serverless can't run the loop).</p>
  <div class="card">
    <label>API base URL <input id="api" size="34" placeholder="https://your-vps:8000"></label>
    <label>Token <input id="tok" size="20" type="password"></label>
    <button onclick="load()">Load status</button>
  </div>
  <div class="card"><h3>Status</h3><pre id="status">—</pre></div>
  <div class="card"><h3>Recent decisions</h3><table id="dec"><tr><th>ts</th><th>symbol</th><th>action</th><th>approved</th></tr></table></div>
  <script>
    async function load() {
      const base = document.getElementById('api').value.replace(/\/$/, '');
      const tok = document.getElementById('tok').value;
      try {
        const r = await fetch(base + '/status', { headers: { Authorization: 'Bearer ' + tok } });
        const j = await r.json();
        document.getElementById('status').textContent = j.config || JSON.stringify(j);
        const t = document.getElementById('dec');
        t.innerHTML = '<tr><th>ts</th><th>symbol</th><th>action</th><th>approved</th></tr>';
        (j.recent_decisions || []).forEach(d => {
          t.innerHTML += `<tr><td>${d.ts}</td><td>${d.symbol}</td><td>${d.action}</td><td>${d.approved}</td></tr>`;
        });
      } catch (e) { document.getElementById('status').textContent = 'Error: ' + e; }
    }
  </script>
</body>
</html>
